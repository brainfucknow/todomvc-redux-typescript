# Every gate this project has, in the order that fails cheapest first.
#
# A gate nobody runs automatically is close in effect to a gate that cannot
# fail, and until this file was rewritten the lint, format, type and end-to-end
# gates were all in that position. Each `run:` below is a command a developer
# can run locally by the same name, so a red job is reproducible in one line.
#
# Node version: one entry, 22.x, which is what this repository is developed and
# verified on. Vite requires ^20.19 || >=22.12 and Vitest ^22.12 || ^24 || >=26,
# so 24.x would very likely work - but "very likely" is the kind of claim this
# project has been burned by, and nothing here has been run on 24. Adding it is
# a one-line change for whoever is willing to prove it.

name: Node CI

# Changes arrive here as pull requests - dependency bumps, mostly - so that is
# where the gates have something to say. `push` stays for the default branch,
# `master`, and is narrowed to it: a branch with an open pull request would
# otherwise be checked twice for one commit, and a branch with no pull request
# is checked the moment one opens.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # scripts/typecheck.mjs anchors its projects to itself rather than to the
      # working directory, and scripts/typecheck-gate.spec.mjs holds the test
      # for that. Do not add a `working-directory:` here without re-reading it.

      # Three Vitest runs, three configs. vite.config.mts knows only the `unit`
      # and `scripts` projects, so nothing under properties/ or hardening/ can
      # reach CI through `npm test` - naming these two here is what runs them.
      # Each costs about a second against the unit suite's twenty-odd, so they
      # come first.
      #
      # Neither needs anything `npm ci` does not install. The generator behind
      # the properties is properties/tiny-check.ts, this repository's own, not a
      # third-party library. The hardening tests are ordinary tests that a
      # surviving mutant argued for: Stryker generates mutants, it does not run
      # these, and both commands pass with @stryker-mutator absent entirely.
      #
      # `npm run acceptance` is the one verification command still outside this
      # file, because it needs Go and an unpinned third-party clone to run.
      - run: npm run properties

      - run: npm run hardening

      - run: npm test

      - run: npm run build

      # React 19 ignores propTypes, and @types/react 19 still declares the
      # property, so a block that crept back would be dead code that lint, the
      # type gate, the unit tests and the build all accept in silence. A grep is
      # the only thing that catches it. Task 07 removed the last three blocks.
      - name: No propTypes under src/
        run: |
          found=0
          grep -rn 'propTypes' src/ || found=$?
          if [ "$found" -eq 0 ]; then
            echo "::error::propTypes is dead code under React 19; the prop interface is the contract."
            exit 1
          fi
          if [ "$found" -ne 1 ]; then
            echo "::error::grep failed with status $found, so nothing was checked."
            exit "$found"
          fi

      # The runner image ships no Playwright browsers, and the suite pins the
      # build that matches @playwright/test in package-lock.json. `npx` runs the
      # CLI that npm ci just installed, so the browser and the client always
      # agree on a version. Only chromium: qa/suite-config.ts declares one
      # project and it is chromium. `--with-deps` adds the system libraries the
      # browser needs, which the image does not guarantee either.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds the app and runs it against the stub backend in qa/. The dev- and
      # preview-server variants of the same procedures (test:e2e:dev,
      # test:e2e:preview) are deliberately not here: they re-run these cases
      # through a second server and a proxy hop, which adds moving parts without
      # adding covered behavior.
      - run: npm run test:e2e

      - name: Keep the Playwright report from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: qa/.artifacts/
          retention-days: 7
